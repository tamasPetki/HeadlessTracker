<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headless Tracker Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #7d8590;
    --line: #30363d;
    --accent: #58a6ff;
    --pos: #3fb950;
    --neg: #f85149;
    --bar: #2f81f7;
    --tag-bg: #21262d;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --accent: #0969da;
      --pos: #1a7f37;
      --neg: #cf222e;
      --bar: #0969da;
      --tag-bg: #eaeef2;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 12px; }
  header select, header button {
    background: var(--tag-bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }
  #tabs {
    display: flex;
    gap: 4px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
    border-radius: 6px;
  }
  .tab:hover { background: var(--tag-bg); }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); border-radius: 0; }
  #tab-content { padding: 16px; }
  section { margin-bottom: 24px; }
  section h3 {
    margin: 0 0 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }
  .kpi {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .kpi-label { color: var(--muted); font-size: 12px; }
  .kpi-value { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .kpi-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .fx-line { color: var(--muted); font-size: 12px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.muted, .muted { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; font-style: italic; }
  .loading { color: var(--muted); padding: 24px; text-align: center; }
  .error { color: var(--neg); padding: 16px; }
  .caveat { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 0; }
  .summary { font-weight: 500; padding: 8px 12px; background: var(--tag-bg); border-radius: 6px; margin: 8px 0; }
  .meta-line { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .warnings ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 12px; }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    background: var(--tag-bg);
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
  }
  .tag-buy, .tag-trade { color: var(--pos); }
  .tag-sell { color: var(--neg); }
  .status {
    color: var(--muted);
    font-size: 12px;
    margin-left: auto;
  }
  .status.error { color: var(--neg); }
  .status-pass { color: var(--pos); font-weight: 600; }
  .status-warn { color: #d29922; font-weight: 600; }
  .status-alert { color: var(--neg); font-weight: 600; }
  .bar-chart { width: 100%; max-width: 580px; }
  .bar { fill: var(--bar); }
  .bar-label, .bar-value { fill: var(--fg); font-size: 12px; }
  .bar-value { font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--muted); margin-top: 8px; }
  details ul { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Headless Tracker</h1>
  <div class="spacer"></div>
  <label for="currency-select">Currency</label>
  <select id="currency-select"></select>
  <button id="refresh-btn" title="Invalidate cache and re-fetch">Refresh</button>
  <span id="status" class="status"></span>
</header>
<div id="tabs"></div>
<div id="tab-content"></div>
<script type="module">__BUNDLED_JS__</script>
</body>
</html>
