name: Contract canary

# Hits the live, keyless upstream APIs each connector parses and asserts the
# response shapes still match what the parsers consume. This is the guard that
# would have caught the v1.0.13 Jupiter v2->v3 migration ($0 Solana balance bug)
# before it reached users. Network/rate-limit noise is a WARN (exit 0); only a
# genuine shape drift or a vanished endpoint is a FAIL (exit 1) — see
# scripts/contract-check.ts. On FAIL this opens (or comments on) a tracking issue.

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mondays & Thursdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      - name: Run contract canary
        run: |
          set -o pipefail
          bun run contract 2>&1 | tee canary-output.txt

      - name: Open or update drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('canary-output.txt', 'utf8'); } catch (e) {}
            const title = '🛑 Upstream contract drift detected';
            const body = [
              'The contract canary detected that a third-party API a connector parses has changed shape (or an endpoint is gone).',
              '',
              'This is the class of bug that shipped the v1.0.13 "$0 Solana balance" issue. Fix the affected parser before more users hit it.',
              '',
              '```',
              output.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'contract-drift',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['contract-drift'],
              });
            }
