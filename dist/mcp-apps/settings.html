<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headless Tracker — Settings</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #7d8590;
    --line: #30363d;
    --accent: #58a6ff;
    --pos: #3fb950;
    --neg: #f85149;
    --warn-bg: #3a2d1c;
    --warn-fg: #d29922;
    --tag-bg: #21262d;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --accent: #0969da;
      --pos: #1a7f37;
      --neg: #cf222e;
      --warn-bg: #fff8c5;
      --warn-fg: #9a6700;
      --tag-bg: #eaeef2;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  #tabs {
    display: flex;
    gap: 4px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
    border-radius: 6px;
  }
  .tab:hover { background: var(--tag-bg); }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); border-radius: 0; }
  #tab-content { padding: 16px; }
  section { margin-bottom: 24px; }
  section h3 {
    margin: 0 0 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  td.muted, .muted { color: var(--muted); font-size: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
  code {
    font-family: ui-monospace, SFMono-Regular, monospace;
    background: var(--tag-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }
  .empty { color: var(--muted); padding: 12px; text-align: center; font-style: italic; }
  .loading { color: var(--muted); padding: 24px; text-align: center; }
  .error {
    color: var(--neg);
    padding: 8px 12px;
    background: rgba(248, 81, 73, 0.08);
    border-radius: 6px;
    margin: 8px 0;
  }
  .success {
    color: var(--pos);
    padding: 8px 12px;
    background: rgba(63, 185, 80, 0.08);
    border-radius: 6px;
    margin: 8px 0;
  }
  .disclosure {
    background: var(--warn-bg);
    color: var(--warn-fg);
    padding: 12px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.5;
    border-left: 3px solid var(--warn-fg);
  }
  .disclosure code { background: rgba(0,0,0,0.15); }
  .connector-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 540px;
    margin-top: 12px;
  }
  .form-grid label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .form-grid label.inline {
    flex-direction: row;
    align-items: center;
    gap: 8px;
    color: var(--fg);
  }
  .form-grid input[type=text],
  .form-grid input[type=password],
  .form-grid input[type=number],
  .form-grid select {
    background: var(--tag-bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
    font-family: inherit;
  }
  .form-grid input:focus, .form-grid select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .form-grid fieldset {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-grid fieldset legend { padding: 0 6px; color: var(--muted); font-size: 12px; }
  .form-grid small { font-size: 11px; }
  button.btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font: inherit;
    cursor: pointer;
  }
  button.btn-primary:disabled { opacity: 0.6; cursor: progress; }
  button.btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
  button.btn-danger {
    background: transparent;
    color: var(--neg);
    border: 1px solid var(--neg);
    border-radius: 4px;
    padding: 3px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button.btn-danger:hover:not(:disabled) { background: rgba(248, 81, 73, 0.1); }
  button.btn-danger:disabled { opacity: 0.6; cursor: progress; }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    background: var(--tag-bg);
    border-radius: 4px;
    font-size: 11px;
    text-transform: lowercase;
  }
  .tag-bybit { color: #f0b90b; }
  .tag-metamask { color: #f6851b; }
  .tag-polymarket { color: #58a6ff; }
  .status {
    color: var(--muted);
    font-size: 12px;
    margin-left: auto;
  }
  .status.error { color: var(--neg); }
  a { color: var(--accent); }
  p { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>Headless Tracker — Settings</h1>
  <span id="status" class="status"></span>
</header>
<div id="tabs"></div>
<div id="tab-content"></div>
